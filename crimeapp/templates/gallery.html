
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Crime Investigation Gallery</title>

    <style>
        div.gallery {
            border: 1px solid #ccc;
            height: 100%;
        }

        div.gallery:hover {
            border: 1px solid #777;
        }

        div.gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        div.desc {
            padding: 15px;
            text-align: center;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        h2, h4 {
            text-align: center;
        }

        .responsive {
            padding: 6px;
            float: left;
            width: 25%;
        }

        @media only screen and (max-width: 700px) {
            .responsive {
                width: 50%;
            }
        }

        @media only screen and (max-width: 500px) {
            .responsive {
                width: 100%;
            }
        }

        .clearfix:after {
            content: "";
            display: table;
            clear: both;
        }
        .back-btn {
    display: inline-block;
    padding: 10px 18px;
    background-color: #333;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    margin-bottom: 15px;
}

.back-btn:hover {
    background-color: #555;
}
    </style>
</head>

<body>

<h2>Crime Investigation Gallery</h2>
<a href="{% url 'index' %}" class="back-btn">← Back to Home</a>
<h4>Police, Investigation and Public Safety</h4>

<div class="responsive">
    <div class="gallery">
        <img src="{% static 'assets/img/Crime Aesth.jpg' %}"
             alt="Crime Investigation">
        <div class="desc">Crime Investigation</div>
    </div>
</div>

<div class="responsive">
    <div class="gallery">
        <img src="{% static 'assets/img/Crimpin.png' %}"
             alt="Police Investigation">
        <div class="desc">Police Investigation</div>
    </div>
</div>

<div class="responsive">
    <div class="gallery">
        <img src="{% static 'assets/img/sherlock.jpg.jpg' %}"
             alt="Detective Investigation">
        <div class="desc">Detective Investigation</div>
    </div>
</div>

<div class="responsive">
    <div class="gallery">
        <img src="{% static 'assets/img/hospital.jpg' %}"
             alt="Medical Support">
        <div class="desc">Medical Support</div>
    </div>
</div>

<div class="clearfix"></div>

</body>
</html>
